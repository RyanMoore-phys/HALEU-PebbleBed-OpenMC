name: Block infrastructure
on:
  workflow_dispatch:
    inputs:
      stack:
        type: choice
        options: [core, campaign]
        required: true
      operation:
        type: choice
        options: [plan, apply, close-campaign]
        required: true
permissions:
  contents: read
  id-token: write
concurrency: block-infrastructure
jobs:
  infra:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      STACK: ${{ inputs.stack }}
      OPERATION: ${{ inputs.operation }}
    steps:
      - uses: actions/checkout@v4
      - name: Read deployment configuration
        id: deployment
        run: echo "config=$(jq -ce . infra/deployment.json)" >> "$GITHUB_OUTPUT"
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: '1.10.6'
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ fromJSON(steps.deployment.outputs.config).oidc_role_arn }}
          aws-region: ${{ fromJSON(steps.deployment.outputs.config).region }}
      - name: Manage selected stack
        env:
          TF_VAR_state_bucket: ${{ fromJSON(steps.deployment.outputs.config).state_bucket }}
          TF_VAR_az: ${{ fromJSON(steps.deployment.outputs.config).availability_zone }}
        run: |
          cd "infra/$STACK"
          tofu init -backend-config="bucket=$TF_VAR_state_bucket" -backend-config="key=block/$STACK.tfstate" -backend-config="region=$AWS_REGION" -backend-config="use_lockfile=true"
          tofu validate
          case "$OPERATION" in
            plan) tofu plan ;;
            apply) tofu plan -out=apply.plan && tofu apply apply.plan && tofu output >> "$GITHUB_STEP_SUMMARY" ;;
            close-campaign) [[ "$STACK" == campaign ]] && tofu destroy -auto-approve ;;
          esac
