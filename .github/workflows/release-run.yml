name: Publish or submit block depletion
on:
  workflow_call:
    inputs:
      stage:
        type: string
        required: true
      job_definition_arn:
        type: string
        required: true
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      stage:
        description: Registered Batch definition to submit
        type: choice
        options: [seed, geometry, smoke, mpi-check, mpi-smoke, production, mhtgr-geometry, mhtgr-cold, mhtgr-pilot, mhtgr-depletion]
        required: true
      job_definition_arn:
        description: Exact revision ARN from registration (blank uses deployment.json)
        type: string
        required: false
permissions:
  contents: read
  id-token: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check benchmark contracts without running transport
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q benchmarks
          bash -n scripts/batch-entrypoint.sh scripts/register-definitions.sh scripts/register-release.sh
  publish:
    needs: validate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read deployment configuration
        id: deployment
        run: echo "config=$(jq -ce . infra/deployment.json)" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ fromJSON(steps.deployment.outputs.config).oidc_role_arn }}
          aws-region: ${{ fromJSON(steps.deployment.outputs.config).region }}
      - uses: aws-actions/amazon-ecr-login@v2
        id: ecr
      - name: Build Linux image and report digest
        env:
          REPO: ${{ steps.ecr.outputs.registry }}/block-depletion
        run: |
          docker build --platform linux/amd64 -t "$REPO:$GITHUB_REF_NAME" .
          docker push "$REPO:$GITHUB_REF_NAME"
          docker inspect --format '{{index .RepoDigests 0}}' "$REPO:$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
  submit:
    needs: validate
    outputs:
      job_id: ${{ steps.batch.outputs.job_id }}
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read deployment configuration
        id: deployment
        run: echo "config=$(jq -ce . infra/deployment.json)" >> "$GITHUB_OUTPUT"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ fromJSON(steps.deployment.outputs.config).oidc_role_arn }}
          aws-region: ${{ fromJSON(steps.deployment.outputs.config).region }}
      - name: Submit registered revision
        id: batch
        env:
          QUEUE: ${{ fromJSON(steps.deployment.outputs.config).queue }}
          STAGE: ${{ inputs.stage }}
          DEFINITION_OVERRIDE: ${{ inputs.job_definition_arn }}
        run: |
          definition=$DEFINITION_OVERRIDE
          if [[ -z "$definition" ]]; then
            definition=$(jq -r --arg name "$STAGE" '.definitions[$name] // ""' infra/deployment.json)
          fi
          region=$(jq -er .region infra/deployment.json)
          account=$(jq -er '.oidc_role_arn | split(":")[4]' infra/deployment.json)
          prefix="arn:aws:batch:$region:$account:job-definition/block-$STAGE:"
          revision=${definition#"$prefix"}
          if [[ "$definition" != "$prefix"* || ! "$revision" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Supply an exact block-$STAGE revision ARN in this account/region, or pin it in deployment.json."
            exit 1
          fi
          args=()
          if [[ "$STAGE" == mpi-check || "$STAGE" == mpi-smoke || "$STAGE" == production || "$STAGE" == mhtgr-pilot || "$STAGE" == mhtgr-depletion ]]; then
            override=$(jq -nc --arg id "gha-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" '{nodePropertyOverrides:[{targetNodes:"0:",containerOverrides:{environment:[{name:"SHARED_RUN_ID",value:$id}]}}]}')
            args+=(--node-overrides "$override")
          fi
          job_id=$(aws batch submit-job --job-name "block-$STAGE-$GITHUB_RUN_ID" --job-queue "$QUEUE" --job-definition "$definition" "${args[@]}" --query jobId --output text)
          echo "job_id=$job_id" >> "$GITHUB_OUTPUT"
          echo "Submitted Batch job \`$job_id\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Definition: \`$definition\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$STAGE" == mhtgr-* ]]; then
            results=$(jq -er .results_s3_uri infra/registration.json)
            run_path="$job_id/attempt-1"
            if [[ "$STAGE" == mhtgr-pilot || "$STAGE" == mhtgr-depletion ]]; then
              run_path="gha-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT/attempt-1"
            fi
            echo "Benchmark output after completion: \`$results/$run_path/\`" >> "$GITHUB_STEP_SUMMARY"
            echo "Download comparison.html with benchmark-comparison.png; comparison.md, CSV and JSON are also uploaded. Geometry stage produces plots and geometry-audit.json instead." >> "$GITHUB_STEP_SUMMARY"
            echo "Benchmark agreement follows the case policy embedded in this image. Under advisory policy, Batch success means calculation, report generation and upload completed; inspect comparison.json for screening_pass/screening_fail. It does not establish validation." >> "$GITHUB_STEP_SUMMARY"
          fi
  monitor_1:
    name: Watch Batch (1/6)
    needs: submit
    uses: ./.github/workflows/watch-batch.yml
    with:
      job_id: ${{ needs.submit.outputs.job_id }}
  monitor_2:
    name: Watch Batch (2/6)
    needs: [submit, monitor_1]
    if: needs.monitor_1.outputs.pending == 'true'
    uses: ./.github/workflows/watch-batch.yml
    with:
      job_id: ${{ needs.submit.outputs.job_id }}
  monitor_3:
    name: Watch Batch (3/6)
    needs: [submit, monitor_2]
    if: needs.monitor_2.outputs.pending == 'true'
    uses: ./.github/workflows/watch-batch.yml
    with:
      job_id: ${{ needs.submit.outputs.job_id }}
  monitor_4:
    name: Watch Batch (4/6)
    needs: [submit, monitor_3]
    if: needs.monitor_3.outputs.pending == 'true'
    uses: ./.github/workflows/watch-batch.yml
    with:
      job_id: ${{ needs.submit.outputs.job_id }}
  monitor_5:
    name: Watch Batch (5/6)
    needs: [submit, monitor_4]
    if: needs.monitor_4.outputs.pending == 'true'
    uses: ./.github/workflows/watch-batch.yml
    with:
      job_id: ${{ needs.submit.outputs.job_id }}
  monitor_6:
    name: Watch Batch (6/6)
    needs: [submit, monitor_5]
    if: needs.monitor_5.outputs.pending == 'true'
    uses: ./.github/workflows/watch-batch.yml
    with:
      job_id: ${{ needs.submit.outputs.job_id }}
      final_window: true
